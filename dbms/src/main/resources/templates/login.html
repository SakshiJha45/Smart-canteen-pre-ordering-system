<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Log in')}"></head>
<body>
<main class="wrap narrow">
  <h1>Skip the queue.</h1>
  <p class="muted">Order ahead, get a token, collect when it's ready.</p>
  <div th:replace="~{fragments :: flash}"></div>
  <form class="panel" method="post" th:action="@{/login}">
    <label for="email">Email</label>
    <input id="email" type="email" name="email" required autofocus>
    <label for="password">Password</label>
    <input id="password" type="password" name="password" required>
    <p><button type="submit">Log in</button></p>
    <p class="muted">New here? <a th:href="@{/register}">Create an account</a></p>
  </form>
  
</main>
</body>
</html>
