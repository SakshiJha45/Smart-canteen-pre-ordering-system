<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head('Manage menu')}"></head>
<body>
<nav th:replace="~{fragments :: nav}"></nav>
<main class="wrap" style="max-width:1100px">
  <h1>Manage menu</h1>
  <div th:replace="~{fragments :: flash}"></div>

  <div class="scroll"><table>
    <tr><th>Item</th><th>Category</th><th>Price (₹)</th><th>Stock</th><th>On menu</th><th></th></tr>
    <tr th:each="i : ${items}">
      <td><form th:id="'f' + ${i.item_id}" method="post" th:action="@{/admin/menu/update}"></form>
          <span th:text="${i.emoji + ' ' + i.name}">Item</span></td>
      <td th:text="${i.category}">Snacks</td>
      <td><input type="hidden" name="itemId" th:value="${i.item_id}" th:attr="form=${'f' + i.item_id}">
          <input type="number" name="price" step="0.01" min="0.01" th:value="${i.price}" th:attr="form=${'f' + i.item_id}" aria-label="Price"></td>
      <td><input type="number" name="stock" min="0" th:value="${i.stock}" th:attr="form=${'f' + i.item_id}" aria-label="Stock"></td>
      <td><input type="checkbox" name="available" th:checked="${i.available_flag == 1}" th:attr="form=${'f' + i.item_id}" aria-label="Show on menu"></td>
      <td><button class="small" type="submit" th:attr="form=${'f' + i.item_id}">Save</button></td>
    </tr>
  </table></div>

  <h2>Add a new item</h2>
  <form class="panel" method="post" th:action="@{/admin/menu/add}">
    <label for="name">Name</label><input id="name" name="name" required>
    <label for="description">Short description</label><input id="description" name="description">
    <label for="price">Price (₹)</label><input id="price" name="price" type="number" step="0.01" min="0.01" required>
    <label for="categoryId">Category</label>
    <select id="categoryId" name="categoryId"><option th:each="c : ${categories}" th:value="${c.category_id}" th:text="${c.name}">Snacks</option></select>
    <label for="emoji">Emoji</label><input id="emoji" name="emoji" placeholder="🍽️">
    <label for="stock">Starting stock</label><input id="stock" name="stock" type="number" min="0" value="20" required>
    <p><button type="submit">Add item</button></p>
  </form>
</main>
</body>
</html>
